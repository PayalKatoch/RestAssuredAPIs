name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Rest Assured tests in Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t restassured-api-tests .

      - name: Run tests and generate Allure report inside Docker container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            restassured-api-tests \
            /bin/bash -lc "mvn -B clean test && allure generate target/allure-results -o target/allure-report --clean"

      - name: Upload Allure and test reports
        uses: actions/upload-artifact@v4
        with:
          name: rest-assured-test-report
          path: |
            target/allure-results
            target/allure-report
            target/surefire-reports
