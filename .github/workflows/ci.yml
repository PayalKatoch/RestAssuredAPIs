name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Rest Assured tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Run Maven tests
        run: mvn -B clean test

      - name: Generate Allure HTML report
        if: success()
        run: |
          curl -sL https://repo1.maven.org/maven2/io/qameta/allure/allure-commandline/2.29.1/allure-commandline-2.29.1.zip -o /tmp/allure-commandline.zip
          unzip -q /tmp/allure-commandline.zip -d /tmp
          chmod +x /tmp/allure-2.29.1/bin/allure
          /tmp/allure-2.29.1/bin/allure generate target/allure-results -o target/allure-report --clean

      - name: Upload Allure and test reports
        uses: actions/upload-artifact@v4
        with:
          name: rest-assured-test-report
          path: |
            target/allure-results
            target/allure-report
            target/surefire-reports
